<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px 16px;background:#fbfaf7;color:#1c1b19;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5">
    <div style="max-width:560px;margin:0 auto">
      <p style="margin:0 0 4px;font-size:14px;color:#6b6862">Prep reviews</p>
      <h1 style="margin:0 0 16px;font-size:22px">$heading</h1>
      <ul style="margin:0 0 24px;padding-left:20px">
$problems
      </ul>
      <p style="margin:0 0 32px">
        <a href="$today_url" style="display:inline-block;padding:10px 18px;border-radius:6px;background:#2f5bd3;color:#ffffff;font-weight:600;text-decoration:none">Open today's reviews</a>
      </p>
      <p style="margin:0;font-size:13px;color:#6b6862">
        You get this at $email_hour your time on days with reviews due.
        <a href="$settings_url" style="color:#6b6862">Turn off emails or change your time zone</a>.
      </p>
    </div>
  </body>
</html>
